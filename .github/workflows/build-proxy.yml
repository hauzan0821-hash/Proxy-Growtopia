name: Build Proxy

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore proxy1.sln

      - name: Build
        run: dotnet build proxy1.sln --configuration Release --no-restore

      - name: Publish win-x64
        run: dotnet publish Proxy/Proxy.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-win-x64
          path: Proxy/bin/Release/net8.0/win-x64/publish
