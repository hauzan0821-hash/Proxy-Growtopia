name: Release Zip

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish Proxy/Proxy.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true
      - name: Zip artifact
        run: Compress-Archive -Path Proxy/bin/Release/net8.0/win-x64/publish/* -DestinationPath proxy-win-x64.zip
        shell: pwsh
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: proxy-win-x64-zip
          path: proxy-win-x64.zip
